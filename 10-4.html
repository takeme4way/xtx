<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>媒体查询响应式布局 - 八盒子</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-width: 320px;
            font-family: "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            padding: 1rem;
        }
        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #333;
        }
        /* 容器：默认小屏 1 列 */
        .grid {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 0.75rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .box {
            height: 6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.25rem;
            border-radius: 0.5rem;
            font-weight: bold;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
        }
        /* 8 种颜色 */
        .box:nth-child(1) { background: #e74c3c; }
        .box:nth-child(2) { background: #e67e22; }
        .box:nth-child(3) { background: #f1c40f; }
        .box:nth-child(4) { background: #2ecc71; }
        .box:nth-child(5) { background: #1abc9c; }
        .box:nth-child(6) { background: #3498db; }
        .box:nth-child(7) { background: #9b59b6; }
        .box:nth-child(8) { background: #34495e; }

        /* ≥480px：2 列 */
        @media (min-width: 30rem) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        /* ≥768px：4 列 */
        @media (min-width: 48rem) {
            .grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        /* ≥1024px：8 列 */
        @media (min-width: 64rem) {
            .grid {
                grid-template-columns: repeat(8, 1fr);
            }
        }
    </style>
</head>
<body>
    <h1>许桐欣</h1>
    <div class="grid">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
    </div>
</body>
</html>
