<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>许桐欣的JavaScript·</h2>
    <script>
    document.write("hello world");
    alert("hello world");
    console.log("hello world");
    //prompt和confirm
    var name = prompt("请输入您的姓名");
    console.log(name);
    var age = confirm("您确定是" + name + "吗？");
    console.log(age);
    </script>
</body>
</html>
