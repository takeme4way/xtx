<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24001010909 xutongxin</title>
</head>
<body>
    <h2>HTML表单form</h2>
    <form action= "http://huangqiu.com" name="yl">
        <p>
        用户名:<input type="text" name="username" value="请输入用户名">
        </p>
        <p>
        密码:<input type="password" name="password" value="请输入密码">
        </p>
        <p>
        性别:<input type="radio" name="sex" value="男">男
        <input type="radio" name="sex" value="女">女 
        </p>
        <p>
            <!-- //单选有name属性，name相同的单选框只能选择一个 -->
            爱好:<input type="checkbox" name="hobby" value="篮球">篮球
            <input type="checkbox" name="hobby" value="足球">足球
            <input type="checkbox" name="hobby" value="乒乓球">乒乓球
        </p>
        <!-- 籍贯 -->
        <p>
            籍贯:<select name="province">
                  <option value="北京">北京</option>
                  <option value="上海" selected>上海</option>//selected表示默认选中
                  <option value="广东">广东</option>
                  <option value="浙江">浙江</option>
            </select>
        </p>
        <p>
            <!-- 个人简介 -->
            个人简介:<textarea name="intro" rows="5" cols="30">请输入个人简介</textarea>
        </p>
        <!-- 出生日期 -->
        <p>
            出生日期:<input type="date" name="birthday">//企业级开发不能用type="date"，因为IE不支持
        </p>
        <!-- 多文件上传 -->
        <p>
            上传文件:<input type="file" name="file" multiple>//multiple表示可以上传多个文件
        </p>
        <!-- 按钮:普通按钮 提交按钮 重置按钮 -->
        <p>
            <input type="button" value="普通按钮">
            <input type="submit" value="提交按钮">
            <input type="reset" value="重置按钮">
    </form>
        <!-- 按钮 -->
         <button>按钮</button>
</body>
</html>
