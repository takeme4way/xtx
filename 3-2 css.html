<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            color: blueviolet;
            font-size: 50px;
        }
        /* 标签选择器 */
        #box{
            width: 600px;
            height: 500px;
            background-color: #ccc;
        }
        /* id选择器 */

        /* 扩展2：h2黑底白字 */
        h2 {
            background-color: black;
            color: white;
            padding: 5px 10px;
        }

        /* 扩展1：名字的每个字不同颜色，在同一行 (利用span配合行内样式或派生选择器) */
        /* 这里直接在HTML中用span行内样式实现，或者用类名控制 */
        .name-1 { color: red; }
        .name-2 { color: green; }
        .name-3 { color: orange; }

        /* 扩展三(部分)：选择器三个字是白色 */
        /* 可以给包含“CSS选择器”的p标签单独加一个类或者利用子代选择器 */
        #box p:first-child {
            color: white;
        }

        /* 新增一个宽300高300的盒子，有背景颜色 */
        .new-box {
            width: 300px;
            height: 300px;
            background-color: pink;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h2>层叠样式表 CSS</h2>
    <div id="box">
        <!-- 选择器三个字是白色 -->
        <p>CSS选择器</p>
        
        <!-- 名字的每个字不同颜色，在同一行（使用span包裹） -->
        <p>
            <span class="name-1">许</span><span class="name-2">桐</span><span class="name-3">欣</span>
        </p>
        
        <p>CSS属性</p>
    </div>

    <!-- 新增一个宽300高300的盒子，有背景颜色 -->
    <div class="new-box"></div>
</body>
</html>
