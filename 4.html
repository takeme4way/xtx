<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2, h3, p {
            padding: 0;
            margin: 0;
        }
        #box {
            width: 480px;
            padding: 8px;
            border: 1px solid #ccc;
            font: 12px;
            margin: 20px;
        }
        #box h3 {
            font-size: 16px;
            color: #333;
            text-align: center;
            line-height: 33px;
            letter-spacing: 3px;
            color: #036;
        }
        #box p {
            line-height: 150%;
            color: #666;
            text-indent: 2em;
        }
        #box a {
            color: #036;
            text-decoration: none;
        }
        /* 学号：蓝色加粗 */
        .student-id {
            color: blue;
            font-weight: bold;
        }
        /* 姓名：深色加粗 */
        .myname {
            color: #333;
            font-weight: bold;
        }
        /* 难度的值：红色加粗 */
        .difficulty {
            color: red;
            font-weight: bold;
        }
        /* 知识点：紫色边框 */
        .knowledge {
            border: 2px solid purple;
            padding: 4px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <h2>css进阶</h2>
    <div id="box">
        <h3>CSS那些事</h3>
        <p>
            学号：<span class="student-id">24001010909</span>，
            姓名：<span class="myname">许桐欣</span>，
            班级：计算机24009，对于高级网页设计课程的认知的难度为:
            <span class="difficulty">难</span>，中等，简单，最难，最简单，难度为
            <span class="difficulty">中等</span>。
            这个例子对应的知识点是
            <span class="knowledge">CSS群组选择器、CSS属性、CSS盒子模型、CSS布局、CSS动画</span>。
            <a href="#">更多</a>
        </p>
    </div>
</body>
</html>
