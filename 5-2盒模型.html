<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒子模型、框模型,box model</title>
    <style>
        /* body{
            padding:0;
            margin:0;
        } */
        #a{
            width: 400px;
            height: 500px;

            border: 1px solid #039;
            padding: 50px 40px 30px 20px;
            /* 上 右 下 左 */
            margin: 400px auto;
        }
        #b{
            width: 400px;
            height: 400px;

            border: 1px dashed #039;
            margin: 50px auto 40px;
            padding: 100px 100px 100px 100px;
        }
        /* 扩展完成 */
    </style>
</head>
<body>
    <div id = "a">24001010909xutongxin</div>
    <div id = "b">24001010909xutongxin</div>
    <div id = "c">24001010909xutongxin</div>
    <div id = "d">24001010909xutongxin</div>
</body>
</html>
<!-- 有默认的padding margin需要先弄成0，不设置就有浏览器兼容性问题 padding内容到边框 body是全部的 -->
