<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>洛天依 CSS 动画</title>
    <style>
        /* 全局样式 */
        body {
            margin: 0;
            padding: 0;
            background: #0d0d1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* ========== 舞台：演唱会氛围 ========== */
        .xin-stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(ellipse at 50% 120%, #2a1a4a 0%, #151528 50%, #0d0d1a 100%);
            overflow: hidden;
        }

        /* 聚光灯 */
        .xin-spotlight {
            position: absolute;
            top: -10%;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 120%;
            background: linear-gradient(to bottom, rgba(57, 197, 187, 0.25), transparent 70%);
            clip-path: polygon(45% 0, 55% 0, 100% 100%, 0 100%);
            animation: xin-swayLight 5s ease-in-out infinite alternate;
        }

        @keyframes xin-swayLight {
            from { transform: translateX(-60%) rotate(-4deg); }
            to   { transform: translateX(-40%) rotate(4deg); }
        }

        /* 地面光环 */
        .xin-floor-ring {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 340px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid rgba(57, 197, 187, 0.6);
            box-shadow: 0 0 30px rgba(57, 197, 187, 0.5), inset 0 0 30px rgba(57, 197, 187, 0.3);
            animation: xin-pulseRing 2s ease-in-out infinite;
        }

        @keyframes xin-pulseRing {
            0%, 100% { transform: translateX(-50%) scale(1); opacity: 1; }
            50%      { transform: translateX(-50%) scale(1.15); opacity: 0.6; }
        }

        /* ========== 角色整体：上下浮动 ========== */
        .xin-character {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            width: 260px;
            height: 420px;
            animation: xin-bob 3s ease-in-out infinite;
        }

        @keyframes xin-bob {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50%      { transform: translateX(-50%) translateY(-18px); }
        }

        /* ========== 双马尾（天依标志性青绿色长发） ========== */
        .xin-tail {
            position: absolute;
            top: 60px;
            width: 70px;
            height: 300px;
            background: linear-gradient(to bottom, #39c5bb, #2a9d8f);
            border-radius: 35px 35px 50% 50%;
            z-index: 1;
        }

        .xin-tail-left {
            left: -30px;
            transform-origin: top center;
            animation: xin-swayLeft 2.4s ease-in-out infinite;
        }

        .xin-tail-right {
            right: -30px;
            transform-origin: top center;
            animation: xin-swayRight 2.4s ease-in-out infinite;
        }

        /* 马尾高光 */
        .xin-tail::before {
            content: '';
            position: absolute;
            top: 15px;
            left: 12px;
            width: 16px;
            height: 240px;
            background: rgba(255, 255, 255, 0.35);
            border-radius: 10px;
        }

        @keyframes xin-swayLeft {
            0%, 100% { transform: rotate(6deg); }
            50%      { transform: rotate(-4deg); }
        }

        @keyframes xin-swayRight {
            0%, 100% { transform: rotate(-6deg); }
            50%      { transform: rotate(4deg); }
        }

        /* ========== 头部 ========== */
        .xin-head {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 140px;
            background: #ffe0d0;
            border-radius: 46% 46% 48% 48%;
            z-index: 3;
        }

        /* 刘海（黑色） */
        .xin-bangs {
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 158px;
            height: 70px;
            background: #2b2b3a;
            border-radius: 50% 50% 40% 40%;
            z-index: 4;
        }

        /* 两侧垂发 */
        .xin-side-hair {
            position: absolute;
            top: 40px;
            width: 26px;
            height: 90px;
            background: #2b2b3a;
            border-radius: 13px;
            z-index: 4;
        }

        .xin-side-hair-left  { left: -6px; }
        .xin-side-hair-right { right: -6px; }

        /* 红色发夹（天依标志性配饰） */
        .xin-clip {
            position: absolute;
            top: 34px;
            width: 22px;
            height: 10px;
            background: #e74c3c;
            border-radius: 3px;
            z-index: 5;
        }

        .xin-clip-left  { left: 22px; transform: rotate(-12deg); }
        .xin-clip-right { right: 22px; transform: rotate(12deg); }

        /* ========== 眼睛（青绿色，会眨眼） ========== */
        .xin-eye {
            position: absolute;
            top: 68px;
            width: 22px;
            height: 26px;
            background: #39c5bb;
            border-radius: 50%;
            z-index: 5;
            animation: xin-blink 4s infinite;
        }

        .xin-eye::after {
            content: '';
            position: absolute;
            top: 5px;
            left: 5px;
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
        }

        .xin-eye-left  { left: 34px; }
        .xin-eye-right { right: 34px; }

        @keyframes xin-blink {
            0%, 92%, 100% { transform: scaleY(1); }
            95%           { transform: scaleY(0.1); }
        }

        /* 腮红 */
        .xin-blush {
            position: absolute;
            top: 92px;
            width: 18px;
            height: 10px;
            background: rgba(255, 150, 150, 0.55);
            border-radius: 50%;
            z-index: 5;
        }

        .xin-blush-left  { left: 20px; }
        .xin-blush-right { right: 20px; }

        /* 嘴巴 */
        .xin-mouth {
            position: absolute;
            top: 102px;
            left: 50%;
            transform: translateX(-50%);
            width: 18px;
            height: 9px;
            border: 2px solid #d4736a;
            border-top: none;
            border-radius: 0 0 18px 18px;
            z-index: 5;
        }

        /* ========== 耳机 ========== */
        .xin-headphone-band {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 80px;
            border: 8px solid #1c1c28;
            border-bottom: none;
            border-radius: 80px 80px 0 0;
            z-index: 6;
        }

        .xin-earcup {
            position: absolute;
            top: 52px;
            width: 30px;
            height: 44px;
            background: #1c1c28;
            border-radius: 12px;
            z-index: 6;
        }

        .xin-earcup::after {
            content: '';
            position: absolute;
            top: 10px;
            left: 8px;
            width: 14px;
            height: 24px;
            background: #39c5bb;
            border-radius: 7px;
        }

        .xin-earcup-left  { left: -14px; }
        .xin-earcup-right { right: -14px; }

        /* ========== 身体（黑青配色服装） ========== */
        .xin-body {
            position: absolute;
            top: 130px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 150px;
            background: linear-gradient(to bottom, #2b2b3a, #1c1c28);
            border-radius: 40px 40px 20px 20px;
            z-index: 2;
        }

        /* 领带（青绿色） */
        .xin-tie {
            position: absolute;
            top: 132px;
            left: 50%;
            transform: translateX(-50%);
            width: 18px;
            height: 70px;
            background: #39c5bb;
            clip-path: polygon(50% 0, 100% 15%, 60% 100%, 40% 100%, 0 15%);
            z-index: 3;
        }

        /* 手臂 */
        .xin-arm {
            position: absolute;
            top: 145px;
            width: 24px;
            height: 90px;
            background: #2b2b3a;
            border-radius: 12px;
            z-index: 2;
        }

        .xin-arm-left {
            left: 78px;
            transform-origin: top center;
            animation: xin-waveLeft 1.2s ease-in-out infinite;
        }

        .xin-arm-right {
            right: 78px;
            transform-origin: top center;
            animation: xin-waveRight 1.2s ease-in-out infinite;
        }

        @keyframes xin-waveLeft {
            0%, 100% { transform: rotate(10deg); }
            50%      { transform: rotate(-14deg); }
        }

        @keyframes xin-waveRight {
            0%, 100% { transform: rotate(-10deg); }
            50%      { transform: rotate(14deg); }
        }

        /* 裙摆 */
        .xin-skirt {
            position: absolute;
            top: 262px;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 60px;
            background: linear-gradient(to bottom, #39c5bb, #2a9d8f);
            clip-path: polygon(15% 0, 85% 0, 100% 100%, 0 100%);
            z-index: 2;
        }

        /* 腿 */
        .xin-leg {
            position: absolute;
            top: 315px;
            width: 22px;
            height: 80px;
            background: #ffe0d0;
            border-radius: 10px;
            z-index: 1;
        }

        .xin-leg-left  { left: 95px; }
        .xin-leg-right { right: 95px; }

        /* 靴子 */
        .xin-boot {
            position: absolute;
            top: 385px;
            width: 30px;
            height: 30px;
            background: #1c1c28;
            border-radius: 8px 8px 12px 12px;
            z-index: 1;
        }

        .xin-boot-left  { left: 91px; }
        .xin-boot-right { right: 91px; }

        /* ========== 漂浮音符 ========== */
        .xin-note {
            position: absolute;
            font-size: 28px;
            color: #39c5bb;
            text-shadow: 0 0 10px rgba(57, 197, 187, 0.8);
            animation: xin-floatNote 4s ease-in infinite;
            opacity: 0;
        }

        .xin-note-1 { left: 20%; bottom: 100px; animation-delay: 0s; }
        .xin-note-2 { left: 35%; bottom: 80px;  animation-delay: 1s; font-size: 22px; }
        .xin-note-3 { left: 60%; bottom: 90px;  animation-delay: 2s; }
        .xin-note-4 { left: 75%; bottom: 70px;  animation-delay: 0.5s; font-size: 24px; }
        .xin-note-5 { left: 50%; bottom: 60px;  animation-delay: 3s; font-size: 20px; }

        @keyframes xin-floatNote {
            0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
            15%  { opacity: 1; }
            100% { transform: translateY(-450px) rotate(40deg); opacity: 0; }
        }

        /* ========== 标题 ========== */
        .xin-title {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #39c5bb;
            font-size: 2em;
            font-weight: bold;
            letter-spacing: 6px;
            text-shadow: 0 0 20px rgba(57, 197, 187, 0.8);
            z-index: 10;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="xin-stage">
        <div class="xin-title">洛天依 · Luo Tianyi</div>
        <div class="xin-spotlight"></div>
        <div class="xin-floor-ring"></div>

        <!-- 角色 -->
        <div class="xin-character">
            <!-- 双马尾 -->
            <div class="xin-tail xin-tail-left"></div>
            <div class="xin-tail xin-tail-right"></div>

            <!-- 头部 -->
            <div class="xin-head">
                <div class="xin-bangs"></div>
                <div class="xin-side-hair xin-side-hair-left"></div>
                <div class="xin-side-hair xin-side-hair-right"></div>
                <div class="xin-clip xin-clip-left"></div>
                <div class="xin-clip xin-clip-right"></div>
                <div class="xin-eye xin-eye-left"></div>
                <div class="xin-eye xin-eye-right"></div>
                <div class="xin-blush xin-blush-left"></div>
                <div class="xin-blush xin-blush-right"></div>
                <div class="xin-mouth"></div>
            </div>

            <!-- 耳机 -->
            <div class="xin-headphone-band"></div>
            <div class="xin-earcup xin-earcup-left"></div>
            <div class="xin-earcup xin-earcup-right"></div>

            <!-- 身体 -->
            <div class="xin-body"></div>
            <div class="xin-tie"></div>
            <div class="xin-arm xin-arm-left"></div>
            <div class="xin-arm xin-arm-right"></div>
            <div class="xin-skirt"></div>
            <div class="xin-leg xin-leg-left"></div>
            <div class="xin-leg xin-leg-right"></div>
            <div class="xin-boot xin-boot-left"></div>
            <div class="xin-boot xin-boot-right"></div>
        </div>

        <!-- 漂浮音符 -->
        <div class="xin-note xin-note-1">♪</div>
        <div class="xin-note xin-note-2">♫</div>
        <div class="xin-note xin-note-3">♪</div>
        <div class="xin-note xin-note-4">♬</div>
        <div class="xin-note xin-note-5">♫</div>
    </div>
</body>
</html>
