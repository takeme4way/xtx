<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        /* 星号表示所有通配符 */
        u1{
            list-style: none;
        }
        img{
            display: block;
        }
        .ilist{
            display: flex;
            margin: 8px;
        }
        .ilist li{
            width: 30%;
            margin-right: 1px;
            flex-grow: 1;
            position: relative;
        }
        .ilist img{
            width: 100%;
        }
        .ilist p{
            /* 居中 */
            text-align: center;
            font-size: 14px;
            line-height: 33px;
            /* 关于文字的部分 */
            /* 把字挪到图片的内部可以用绝对定位 */
            position:absolute;
            bottom: 0;
            width: 100%;
            background-color: rgba(0,0,0,.5);
            color: #fff;
        }
    </style>
</head>
<body>
    <ul class="ilist">
        <li>
            <img src="img1/2.jpg">
            <p>我的上下文</p>
        </li>
        <li>
            <img src="img1/3.jpg">
            <p>我的上下文</p>
        </li>
        <li>
            <img src="img1/4.jpg">
            <p>我的上下文</p>
        </li>
    </ul>
</body>
</html>
