<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>左图右文布局</title>
    <style>
        /* 全局样式 */
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            padding: 20px;
        }
        .box {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .zitem {
            display: flex;
            padding: 15px;
            border-bottom: 1px solid #ccc;
            align-items: center;
        }
        .zitem:last-child {
            border-bottom: none;
        }
        .zitem img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
        }
        .ytext {
            flex-grow: 1;
            margin-left: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .ytext h3 {
            font-size: 18px;
            line-height: 1.5;
            color: #333;
            margin-bottom: 8px;
        }
        .ytext .meta {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #666;
        }
        .ytext .meta .author {
            font-weight: bold;
        }
        .ytext .meta .time {
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="zitem">
            <img src="img1/1.jpg" alt="图片1">
            <div class="ytext">
                <h3>标题1</h3>
                <div class="meta">
                    <span class="author">作者: xtx</span>
                    <span class="time">2020-10-10</span>
                </div>
            </div>
        </div>
        <div class="zitem">
            <img src="img1/2.jpg" alt="图片2">
            <div class="ytext">
                <h3>标题2</h3>
                <div class="meta">
                    <span class="author">作者: xtx</span>
                    <span class="time">2021-05-15</span>
                </div>
            </div>
        </div>
        <div class="zitem">
            <img src="img1/3.jpg" alt="图片3">
            <div class="ytext">
                <h3>标题3</h3>
                <div class="meta">
                    <span class="author">作者: xtx</span>
                    <span class="time">2022-08-20</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
