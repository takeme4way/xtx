<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>许桐欣的《高级网页设计》课堂实践</title>
    <link rel="stylesheet" href="font_5244722_v0q45bpmzfi/iconfont.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #f0f2f5;
            color: #2c3e50;
            line-height: 1.6;
        }

        /* ===== 顶部 Hero 区 ===== */
        .xtx_hero {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 3rem 1.5rem 2.5rem;
            text-align: center;
        }
        .xtx_hero-icon {
            font-size: 2.5rem;
            display: inline-block;
            background: rgba(255,255,255,0.18);
            width: 4.5rem;
            height: 4.5rem;
            line-height: 4.5rem;
            border-radius: 50%;
            margin-bottom: 1rem;
        }
        .xtx_hero h1 {
            font-size: 2rem;
            letter-spacing: 0.15rem;
        }
        .xtx_hero p {
            margin-top: 0.5rem;
            opacity: 0.85;
            font-size: 0.95rem;
        }
        .xtx_stats {
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            margin-top: 1.5rem;
        }
        .xtx_stat-num {
            font-size: 1.6rem;
            font-weight: bold;
        }
        .xtx_stat-label {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        /* ===== 搜索框 ===== */
        .xtx_search-bar {
            max-width: 720px;
            margin: -1.4rem auto 0;
            padding: 0 1rem;
            position: relative;
        }
        .xtx_search-input {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.8rem;
            border: none;
            border-radius: 2rem;
            font-size: 1rem;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            outline: none;
            transition: box-shadow 0.25s;
        }
        .xtx_search-input:focus {
            box-shadow: 0 4px 20px rgba(102,126,234,0.4);
        }
        .xtx_search-icon {
            position: absolute;
            left: 2rem;
            top: 50%;
            transform: translateY(-50%);
            color: #95a5a6;
            font-size: 1.1rem;
        }

        /* ===== 分类区块 ===== */
        .xtx_main {
            max-width: 1080px;
            margin: 0 auto;
            padding: 2rem 1.25rem 3rem;
        }
        .xtx_category {
            margin-bottom: 2.25rem;
        }
        .xtx_category-head {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 1rem;
        }
        .xtx_category-icon {
            width: 2.2rem;
            height: 2.2rem;
            line-height: 2.2rem;
            text-align: center;
            border-radius: 0.6rem;
            color: #fff;
            font-size: 1.15rem;
        }
        .xtx_category-title {
            font-size: 1.15rem;
            font-weight: bold;
        }
        .xtx_category-count {
            font-size: 0.8rem;
            color: #95a5a6;
        }

        /* ===== 卡片网格 ===== */
        .xtx_grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.9rem;
        }
        .xtx_card {
            display: block;
            background: #fff;
            border-radius: 0.75rem;
            padding: 1.1rem 1.15rem;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            border-top: 3px solid transparent;
        }
        .xtx_card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .xtx_card-name {
            font-weight: bold;
            font-size: 0.98rem;
            margin-bottom: 0.35rem;
        }
        .xtx_card-file {
            font-size: 0.78rem;
            color: #95a5a6;
            font-family: Consolas, monospace;
        }

        /* 分类配色 */
        .xtx_c1 .xtx_category-icon { background: #3498db; }
        .xtx_c1 .xtx_card:hover { border-top-color: #3498db; }
        .xtx_c2 .xtx_category-icon { background: #e74c3c; }
        .xtx_c2 .xtx_card:hover { border-top-color: #e74c3c; }
        .xtx_c3 .xtx_category-icon { background: #2ecc71; }
        .xtx_c3 .xtx_card:hover { border-top-color: #2ecc71; }
        .xtx_c4 .xtx_category-icon { background: #f39c12; }
        .xtx_c4 .xtx_card:hover { border-top-color: #f39c12; }
        .xtx_c5 .xtx_category-icon { background: #9b59b6; }
        .xtx_c5 .xtx_card:hover { border-top-color: #9b59b6; }
        .xtx_c6 .xtx_category-icon { background: #1abc9c; }
        .xtx_c6 .xtx_card:hover { border-top-color: #1abc9c; }
        .xtx_c7 .xtx_category-icon { background: #e67e22; }
        .xtx_c7 .xtx_card:hover { border-top-color: #e67e22; }
        .xtx_c8 .xtx_category-icon { background: #7f8c8d; }
        .xtx_c8 .xtx_card:hover { border-top-color: #7f8c8d; }

        /* 空状态 */
        .xtx_empty {
            display: none;
            text-align: center;
            color: #95a5a6;
            padding: 3rem 0;
        }

        /* ===== 页脚 ===== */
        .xtx_footer {
            text-align: center;
            padding: 1.5rem;
            background: #2c3e50;
            color: rgba(255,255,255,0.75);
            font-size: 0.85rem;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 56.25rem) {
            .xtx_grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 42rem) {
            .xtx_grid { grid-template-columns: repeat(2, 1fr); }
            .xtx_hero h1 { font-size: 1.5rem; }
        }
        @media (max-width: 26rem) {
            .xtx_grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<!-- 姓名：许桐欣 日期：2026-10-22 功能名称：课程实践作品索引导航页 -->

<!-- 顶部 Hero -->
<header class="xtx_hero">
    <span class="xtx_hero-icon iconfont icon-shouye"></span>
    <h1>许桐欣的《高级网页设计》课堂实践</h1>
    <p>原生 HTML + CSS + JavaScript · 课程作业合集</p>
    <div class="xtx_stats">
        <div>
            <div class="xtx_stat-num" id="xtx_pageCount">0</div>
            <div class="xtx_stat-label">页面</div>
        </div>
        <div>
            <div class="xtx_stat-num" id="xtx_categoryCount">0</div>
            <div class="xtx_stat-label">分类</div>
        </div>
    </div>
</header>

<!-- 搜索框 -->
<div class="xtx_search-bar">
    <i class="iconfont icon-sousuo xtx_search-icon"></i>
    <input type="text" class="xtx_search-input" id="xtx_searchInput"
           placeholder="搜索页面名称或文件名，如：动画、flex、14-2">
</div>

<!-- 主体：分类 + 卡片 -->
<main class="xtx_main" id="xtx_main"></main>
<div class="xtx_empty" id="xtx_empty">没有找到匹配的页面</div>

<!-- 页脚 -->
<footer class="xtx_footer">
    <p>&copy; 2026 许桐欣 · 《高级网页设计》课堂实践</p>
</footer>

<script>
    // 页面数据（静态内嵌，非服务器数据）
    var xtx_categories = [
        {
            name: "HTML 基础", cls: "xtx_c1", icon: "icon-shouye",
            pages: [
                { title: "1-1 初识网页", file: "1-1.html" },
                { title: "1-2 基础结构", file: "1-2.html" },
                { title: "2-2 常用标签", file: "2-2.html" },
                { title: "3-1 学号姓名页", file: "3-1.html" },
                { title: "3-2 CSS 入门", file: "3-2 css.html" },
                { title: "4 综合练习", file: "4.html" }
            ]
        },
        {
            name: "CSS 核心", cls: "xtx_c2", icon: "icon-ego-fav",
            pages: [
                { title: "5-1 层叠与继承", file: "5-1层叠与继承.html" },
                { title: "5-2 盒模型", file: "5-2盒模型.html" },
                { title: "6-1 Flex 布局", file: "6-1 flex.html" },
                { title: "6-2 布局练习", file: "6-2.html" },
                { title: "Flex 布局示例集", file: "pratice.html" }
            ]
        },
        {
            name: "图文布局", cls: "xtx_c3", icon: "icon-more-br",
            pages: [
                { title: "7-1 上图下文", file: "7-1上图下文.html" },
                { title: "7-2 左图右文", file: "7-2左图右文.html" }
            ]
        },
        {
            name: "选择器与过渡", cls: "xtx_c4", icon: "icon-sousuo",
            pages: [
                { title: "8-1 CSS3 选择器", file: "8-1 css3选择器.html" },
                { title: "9-1 Transition 过渡", file: "9-1 transition.html" }
            ]
        },
        {
            name: "动画与响应式", cls: "xtx_c5", icon: "icon-shipin",
            pages: [
                { title: "10-1 背景颜色动画", file: "10-1-animation.html" },
                { title: "10-2 动画幻灯片", file: "10-2.html" },
                { title: "10-3 媒体查询与 rem", file: "10-3.html" },
                { title: "10-4 响应式八盒子", file: "10-4.html" },
                { title: "60-1 洛天依 CSS 动画", file: "60-1.html" }
            ]
        },
        {
            name: "图标与 UI", cls: "xtx_c6", icon: "icon-pingguo",
            pages: [
                { title: "13-1 FontAwesome 字体图标", file: "13-1.html" },
                { title: "13-2 Lucide SVG 图标", file: "13-2.html" },
                { title: "13-3 移动端底部导航", file: "13-3.html" }
            ]
        },
        {
            name: "JavaScript", cls: "xtx_c7", icon: "icon-bianji",
            pages: [
                { title: "14-1 JS 入门：输出与弹窗", file: "14-1.html" },
                { title: "14-2 六种基本数据类型", file: "14-2.html" },
                { title: "15-1 逢7过游戏", file: "15-1.html" }
            ]
        }
    ];

    // 渲染分类与卡片
    var xtx_main = document.getElementById("xtx_main");

    function xtx_render(xtx_keyword) {
        var xtx_html = "";
        var xtx_matched = 0;

        for (var i = 0; i < xtx_categories.length; i++) {
            var xtx_cat = xtx_categories[i];
            var xtx_cardsHtml = "";

            for (var j = 0; j < xtx_cat.pages.length; j++) {
                var xtx_page = xtx_cat.pages[j];
                // 关键字过滤（匹配标题或文件名）
                if (xtx_keyword) {
                    var xtx_k = xtx_keyword.toLowerCase();
                    if (xtx_page.title.toLowerCase().indexOf(xtx_k) === -1 &&
                        xtx_page.file.toLowerCase().indexOf(xtx_k) === -1) {
                        continue;
                    }
                }
                xtx_matched++;
                xtx_cardsHtml +=
                    '<a class="xtx_card" href="' + encodeURI(xtx_page.file) + '">' +
                        '<div class="xtx_card-name">' + xtx_page.title + '</div>' +
                        '<div class="xtx_card-file">' + xtx_page.file + '</div>' +
                    '</a>';
            }

            if (xtx_cardsHtml) {
                xtx_html +=
                    '<section class="xtx_category ' + xtx_cat.cls + '">' +
                        '<div class="xtx_category-head">' +
                            '<span class="xtx_category-icon iconfont ' + xtx_cat.icon + '"></span>' +
                            '<span class="xtx_category-title">' + xtx_cat.name + '</span>' +
                            '<span class="xtx_category-count">' + xtx_cat.pages.length + ' 个页面</span>' +
                        '</div>' +
                        '<div class="xtx_grid">' + xtx_cardsHtml + '</div>' +
                    '</section>';
            }
        }

        xtx_main.innerHTML = xtx_html;
        document.getElementById("xtx_empty").style.display = xtx_matched ? "none" : "block";
    }

    // 统计数字
    var xtx_total = 0;
    for (var xtx_i = 0; xtx_i < xtx_categories.length; xtx_i++) {
        xtx_total += xtx_categories[xtx_i].pages.length;
    }
    document.getElementById("xtx_pageCount").innerText = xtx_total;
    document.getElementById("xtx_categoryCount").innerText = xtx_categories.length;

    // 搜索事件
    document.getElementById("xtx_searchInput").addEventListener("input", function () {
        xtx_render(this.value.trim());
    });

    // 初始渲染
    xtx_render("");
</script>
</body>
</html>
