<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Layout Examples</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            padding: 20px;
        }

        h2 {
            text-align: center;
        }

        /* 外部大容器：让多个演示框横向排开 */
        .container-group {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        /* 单个大卡片外框（对应图片里的每一个方框） */
        .demo-card {
            width: 250px;
            height: 300px;
            border: 1px solid #ccc;
            background-color: #fff;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .demo-card h3 {
            font-size: 14px;
            margin: 0 0 10px 0;
            color: #666;
            text-align: center;
        }

        /* ==================== 核心 Flex 布局样式 ==================== */

        /* 通用 Flex 基础类 */
        .flex-box {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 10px; /* 间距 */
            align-content: center; /* 垂直居中整体 */
            justify-content: center; /* 水平居中整体 */
        }

        /* 样式 1：单个居中的 Box */
        .layout-1 .item {
            width: 60px;
            height: 60px;
            background-color: #e0e0e0;
            border: 1px solid #999;
        }

        /* 样式 2：上下两行居中的 Box */
        .layout-2 .item {
            width: 80%;
            height: 50px;
            background-color: #e0e0e0;
            border: 1px solid #999;
        }

        /* 样式 3：四宫格（两列两行） */
        .layout-3 .item {
            width: 45%;
            height: 50px;
            background-color: #e0e0e0;
            border: 1px solid #999;
        }

        /* 样式 4：上大下双列 */
        .layout-4 .item-large {
            width: 100%;
            height: 60px;
            background-color: #e0e0e0;
            border: 1px solid #999;
        }
        .layout-4 .item-small {
            width: 48%;
            height: 50px;
            background-color: #e0e0e0;
            border: 1px solid #999;
        }
    </style>
</head>
<body>

    <h2>24001010909 xutongxin - Flex 布局演进</h2>

    <div class="container-group">

        图 1：单元素居中
        <div class="demo-card">
            <h3>图1: 单元素居中</h3>
            <div class="flex-box layout-1">
                <div class="item"></div>
            </div>
        </div>

        图 2：上下两行居中
        <div class="demo-card">
            <h3>图2: 上下两行</h3>
            <div class="flex-box layout-2">
                <div class="item"></div>
                <div class="item"></div>
            </div>
        </div>

        图 3：四宫格 (两列两行)
        <div class="demo-card">
            <h3>图3: 四宫格</h3>
            <div class="flex-box layout-3">
                <div class="item"></div>
                <div class="item"></div>
                <div class="item"></div>
                <div class="item"></div>
            </div>
        </div>

        图 4：上大下双列
        <div class="demo-card">
            <h3>图4: 上大下双列</h3>
            <div class="flex-box layout-4">
                <div class="item-large"></div>
                <div class="item-small"></div>
                <div class="item-small"></div>
            </div>
        </div>

    </div>

</body>
</html>
